<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="./src/styles/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Avalonix</title>
        <script type="module" src="./src/main.ts" defer></script>
    </head>

    <div id="panels-grid">
        <div class="panel" id="left-panel">
            <button class="button left-panel-button" id="search-media-tab-button">
                <img class="button-image" src="src/assets/search_media.png">
            </button>
            <button class="button left-panel-button" id="tracks-tab-button">
                <img class="button-image" src="src/assets/track_icon.png">
            </button>
            <button class="button left-panel-button" id="albums-tab-button">
                <img class="button-image" style="width: 60px;" src="src/assets/album_icon.png">
            </button>
            <button class="button left-panel-button" id="performers-tab-button">
                <img class="button-image"  src="src/assets/performer_icon.png">
            </button>
            <button class="button left-panel-button" id="queue-tab-button">
                <img class="button-image" style="width: 50px;" src="src/assets/playlists.png">
            </button>
            <button class="button left-panel-button" id="settings-tab-button">
                <img class="button-image" style="width: 60px;" src="src/assets/queue.png">
            </button>
            <button class="button left-panel-button" id="playlists-tab-button">
                <img class="button-image" style="width: 50px;" src="src/assets/settings.png">
            </button>


        </div>
        <div class="panel" id="right-panel">
            <div class="tab" id="media-search-tab">
                <h1>search</h1>
            </div>
            <div class="tab" id="tracks-list-tab">
                <select class="sort-select" id="tracks-sort-select">
                    <option value="ByName"><h4>Name</h4></option>
                    <option value="ByPerformer"><h4>Performer</h4></option>
                    <option value="ByGenre"><h4>Genre</h4></option>
                </select>
                <div class="playable-list" id="tracks-list"></div>
            </div>
            <div class="tab" id="albums-list-tab">
                <div class="playable-list" id="albums-list"></div>
            </div>
            <div class="tab" id="performers-list-tab">
            </div>
            <div class="tab" id="playlists-list-tab">
            </div>
            <div class="tab" id="queue-list-tab">
            </div>
            <div class="tab" id="settings-tab">
            </div>
            <div class="tab" id="track-preview-tab">
            </div>
        </div>
        <div class="panel" id="bottom-panel">
        </div>
    </div>

</html>
